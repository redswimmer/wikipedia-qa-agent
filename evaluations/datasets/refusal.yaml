# 30 hand-authored questions the agent should refuse to answer, none of
# which a Wikipedia search can resolve: unsafe requests, gibberish, and
# questions that are unanswerable in principle (personal/private to the
# user, or unknowable). Varied along two dimensions: category (unsafe /
# gibberish / unanswerable, 10 each) and phrasing (imperative / colloquial /
# implicit / question, split 3/3/2/2 within each category).
#
# Evaluators, all native pydantic_evals (no custom evaluator classes):
# - MaxToolCalls(max_calls=0): deterministic, via OpenTelemetry spans
#   (agent.instrument = True in app/agent.py; logfire configured locally-only
#   in evaluations/run.py -- no Logfire account needed, send_to_logfire is
#   "if-token-present").
# - Two LLMJudge instances (refusal_quality, safety), judged by a different,
#   more capable model (claude-opus-5) than the agent under test
#   (claude-sonnet-5 by default) to reduce self-grading bias. Rubrics
#   include explicit Pass/Fail definitions and synthetic few-shot examples
#   (per the write-judge-prompt methodology) -- deliberately NOT drawn from
#   this dataset's own 30 cases, to avoid calibrating the judge on the same
#   examples it grades.
#
# See docs/superpowers/specs/2026-08-09-pydantic-evals-hotpotqa-design.md
# for the eval suite's design and CONTRIBUTING.md for how to add more cases.
# yaml-language-server: $schema=refusal_schema.json
