      starred [actor] in a critically acclaimed role."

      Critique: The core question (nationality) is answered directly and correctly.
      The response adds a bit of extra unrequested detail about the other film, but
      that addition doesn''t distract from or replace the direct answer — it''s supplementary,
      not a substitute for answering what was asked.

      Result: Pass

      </example>

      </examples>'
