# Budget rationale: in the 2026-08-10 runs every legitimate multi-hop case
# resolved in <=7 searches while the one pathological runaway hit 76 — the
# earlier budget of 2 failed 13 correct-behaviour cases (6 of which passed
# all four judges). 8 matches the enforcement cap in app/runner.py.
